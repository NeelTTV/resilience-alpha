server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    client_max_body_size 16k;
    proxy_set_header X-Lab-Client-IP $http_x_real_ip;
    location = /health { access_log off; return 200 'ok'; }
    location = /api/health { proxy_pass http://api:8000/health; }
    location = /api/transactions { proxy_pass http://api:8000/transactions; }
    location = /auth/token { proxy_pass http://auth:8000/token; }
    location = /control/status { proxy_pass http://supervisor:8000/status; }
    location = /assistant/ask { proxy_pass http://assistant:8000/ask; proxy_read_timeout 100s; }
    location /api/ { return 404; }
    location /auth/ { return 404; }
    location /control/ { return 404; }
    location /assistant/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
