server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    client_max_body_size 16k;
    location = /health { access_log off; return 200 'ok'; }
    location = /api/health { proxy_pass http://api:8000/health; }
    location = /api/transactions { proxy_pass http://api:8000/transactions; }
    location = /auth/token { proxy_pass http://auth:8000/token; }
    location /api/ { return 404; }
    location /auth/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
