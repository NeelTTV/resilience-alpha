name: ${COMPOSE_PROJECT_NAME:-resilience-alpha}

x-python: &python
  build:
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resilience
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U resilience -d resilience"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    <<: *python
    command: [uvicorn, services.auth.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DEMO_PASSWORD_HASH_FILE: /run/secrets/demo_password_hash
      DEMO_USERNAME: ${DEMO_USERNAME:-operator}
    secrets: [jwt_secret, demo_password_hash]

  api:
    <<: *python
    environment:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [jwt_secret, postgres_password]
    depends_on:
      db: {condition: service_healthy}

  dashboard:
    build: ./apps/dashboard
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
      auth: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2d]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  loki:
    image: grafana/loki:3.5.3
    profiles: [observability]
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    secrets: [grafana_password]
    volumes:
      - ./infra/observability/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./infra/observability/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./infra/observability/dashboard.json:/var/lib/grafana/dashboards/resilience.json:ro
      - grafana_data:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  ollama:
    image: ollama/ollama:0.11.10
    profiles: [ai]
    volumes: [ollama_data:/root/.ollama]
    ports: ['127.0.0.1:11434:11434']
    networks: [backend]

networks:
  backend:

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  ollama_data:

secrets:
  postgres_password: {file: ./.secrets/postgres_password}
  jwt_secret: {file: ./.secrets/jwt_secret}
  demo_password_hash: {file: ./.secrets/demo_password_hash}
  grafana_password: {file: ./.secrets/grafana_password}

