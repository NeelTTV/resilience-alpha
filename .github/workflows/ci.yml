name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/init-secrets.py
      - run: docker compose --profile observability --profile ai config --quiet
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: cp infra/esp8266/include/lab_config.example.h infra/esp8266/include/lab_config.h
      - run: pio run --project-dir infra/esp8266
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/requirements.lock
      - run: python scripts/init-secrets.py
      - run: docker compose up --build -d --wait
      # Hosted runners have no host USB camera or ESP8266. Never bypass human MFA.
      - run: python scripts/smoke.py
        env:
          SMOKE_SERVICE_ACCOUNT: '1'
      - run: python scripts/backup_check.py
      - run: python scripts/security_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resilience-evidence
          path: output/evidence
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down

